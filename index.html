<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>干员抽选</title>
<style>
:root{
  --bg:#141518; --panel:#1c1d21; --line:#2c2e34; --text:#e9e9ea; --dim:#8b8d94;
  --accent:#ffcf3a; --accent-ink:#1a1400; --star:#ffb400; --pop:#202126; --must:#5fd08a; --must-bg:#2f7d4a; --ban:#ff7a7a; --ban-bg:#8a2e2e;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans SC",system-ui,sans-serif}
body{min-height:100vh;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,transparent 0%,var(--bg) 75%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:2px solid var(--text);padding-bottom:12px}
h1{margin:0;font-size:30px;letter-spacing:.08em;font-weight:800}
h1 small{display:block;font:600 11px/1.6 Consolas,monospace;letter-spacing:.35em;color:var(--accent)}
.pool{font:12px Consolas,monospace;color:var(--dim);text-align:right}
.pool b{color:var(--text);font-size:20px}

.controls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin:18px 0 8px}
.lbl{font:600 11px Consolas,monospace;letter-spacing:.2em;color:var(--dim);margin-right:8px}
.stepper{display:inline-flex;border:1px solid var(--line);background:var(--panel)}
.stepper button{width:36px;height:40px;border:0;background:transparent;color:var(--text);font-size:18px;cursor:pointer}
.stepper button:hover{background:var(--line)}
.stepper input{width:56px;height:40px;border:0;border-inline:1px solid var(--line);background:transparent;color:var(--text);
  text-align:center;font:700 18px Consolas,monospace;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.quick{display:inline-flex;gap:4px;margin-left:8px}
.quick button{height:28px;padding:0 9px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font:12px Consolas,monospace}
.quick button:hover{color:var(--text);border-color:var(--dim)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent)}
.go{margin-left:auto;display:flex;gap:10px}
.btn{height:44px;padding:0 26px;border:0;cursor:pointer;font:800 16px inherit;letter-spacing:.15em;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--text);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:not-allowed}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 10px}
#filters{margin-bottom:22px}
.chip{height:30px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer;font-size:13px}
.chip.on{border-color:var(--accent);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.chip .n{font:11px Consolas,monospace;opacity:.6;margin-left:4px}

.hint{font-size:12px;color:var(--dim);margin:-8px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);cursor:pointer;overflow:hidden;
  transition:transform .15s,border-color .15s;animation:in .35s ease-out both}
.card:hover{transform:translateY(-3px);border-color:var(--rc)}
.r6{--rc:#ff9a2e}.r5{--rc:#ffd23a}.r4{--rc:#c9a6ff}.r3{--rc:#4fb6ff}.r2{--rc:#c8e04a}.r1{--rc:#b8b8b8}
.chip.rar.on{box-shadow:inset 0 -2px 0 var(--rc);border-color:var(--rc)}
.chip.rar span.s{color:var(--rc)}
.card::after{content:"点击重抽";position:absolute;top:8px;right:8px;font-size:11px;padding:2px 6px;background:rgba(0,0,0,.65);
  color:var(--accent);opacity:0;transition:opacity .15s}
.card:hover::after{opacity:1}
.card .ph{background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 30%,#1c1d21),#1c1d21 70%)!important;aspect-ratio:3/4;overflow:hidden;position:relative;background:linear-gradient(160deg,#3a2f12,#1c1d21 70%);display:grid;place-items:center}
.card .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block;transition:transform .3s}
.card:hover .ph img{transform:scale(1.04)}
.card .ph::after{content:"";position:absolute;inset:auto 0 0 0;height:32%;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.card .ph .fb{font-size:56px;font-weight:800;color:rgba(255,207,58,.5)}
.card .stars{z-index:1;position:absolute;left:8px;bottom:6px;color:var(--rc);font-size:12px;letter-spacing:1px;text-shadow:0 1px 2px #000}
.card .info{padding:10px 12px 12px;border-top:3px solid var(--rc)}
.card .nm{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .en{font:11px Consolas,monospace;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card .cls{margin-top:8px;font-size:12px;color:var(--dim)}
.card .cls b{color:var(--text);font-weight:600;margin-right:6px}
.card a{color:inherit;text-decoration:none}
.card .wiki{position:absolute;right:10px;bottom:12px;font:11px Consolas,monospace;color:var(--dim)}
.card .wiki:hover{color:var(--accent)}
.card.flash{animation:flash .4s ease-out}
.lock{position:absolute;top:8px;left:8px;z-index:2;width:32px;height:32px;display:grid;place-items:center;border:0;cursor:pointer;
  background:rgba(0,0,0,.6);color:#fff;opacity:.55;transition:opacity .15s,background .15s}
.lock svg{width:16px;height:16px}
.card:hover .lock{opacity:1}
.lock:hover{background:rgba(0,0,0,.85)}
.card.locked{outline:2px solid var(--rc);outline-offset:-2px}
.card.locked .lock{opacity:1;background:var(--rc);color:#111}
.card.mustc::after{content:"必出";opacity:1;color:var(--must)}
.card.locked::after{content:"已锁定";opacity:1;color:var(--rc)}
.card .nm .mtag{font-size:11px;font-weight:600;padding:1px 5px;margin-left:6px;vertical-align:2px;background:var(--must-bg);color:#fff}
.pick{display:flex;flex-direction:column;gap:8px;margin:0 0 18px}
.pick-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{position:relative;flex:1 1 240px;max-width:420px;min-width:0}
.search input{width:100%;height:34px;padding:0 10px;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px}
.search input:focus{outline:none;border-color:var(--accent)}
.results{position:absolute;z-index:20;top:calc(100% + 2px);left:0;right:0;background:var(--pop);border:1px solid var(--line);max-height:360px;overflow:auto;box-shadow:0 10px 28px rgba(0,0,0,.55)}
.res{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res img{width:30px;height:30px;object-fit:cover;object-position:50% 8%;flex:none;background:var(--panel)}
.res .rn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.res .rn small{color:var(--dim);margin-left:6px;font-size:11px}
.res .rn .st{color:var(--rc);font-size:11px;margin-left:6px}
.res .none{padding:10px;color:var(--dim);font-size:13px}
.tg{height:26px;padding:0 10px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-size:12px;flex:none}
.tg:hover{color:var(--text);border-color:var(--dim)}
.tg.must.on{background:var(--must-bg);border-color:var(--must);color:#fff}
.tg.ban.on{background:var(--ban-bg);border-color:var(--ban);color:#fff}
.sel-row{display:flex;align-items:flex-start;gap:8px}
.sel-lbl{font-size:12px;line-height:24px;padding:0 8px;flex:none;border:1px solid}
.sel-lbl.must{color:var(--must);border-color:var(--must-bg)}
.sel-lbl.ban{color:var(--ban);border-color:var(--ban-bg)}
.sel-list{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.schip{height:26px;padding:0 8px;border:1px solid var(--line);border-left:3px solid var(--rc);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px}
.schip:hover{border-color:var(--dim);border-left-color:var(--rc)}
.schip span{color:var(--dim);margin-left:6px}
.pick-tip{font-size:12px;color:var(--dim)}
.sel-lbl{background:transparent;cursor:pointer;font-family:inherit}
.sel-lbl:hover{filter:brightness(1.3)}
.mini.must{color:var(--must);border-color:var(--must-bg)}
.mini.ban{color:var(--ban);border-color:var(--ban-bg)}
.mini.must:hover,.mini.ban:hover{filter:brightness(1.3)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);border:1px solid var(--line);width:min(1040px,100%);height:min(780px,100%);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.m-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--text)}
.m-head h2{margin:0 8px 0 0;font-size:16px;letter-spacing:.06em}
.m-tabs{display:flex;gap:6px;flex:1}
.m-tab{height:34px;padding:0 14px;border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer;font-weight:700;font-size:14px;font-family:inherit}
.m-tab span{font:12px Consolas,monospace;margin-left:4px;opacity:.8}
.m-tab.must.on{color:#fff;background:var(--must-bg);border-color:var(--must)}
.m-tab.ban.on{color:#fff;background:var(--ban-bg);border-color:var(--ban)}
.m-close{width:34px;height:34px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:20px;line-height:1;cursor:pointer}
.m-close:hover{border-color:var(--dim)}
.m-filters{display:flex;flex-direction:column;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.m-filters input{height:32px;width:100%;max-width:320px;padding:0 10px;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px}
.m-filters input:focus{outline:none;border-color:var(--accent)}
.m-chips{display:flex;flex-wrap:wrap;gap:4px}
.m-chips .chip{height:26px;font-size:12px;padding:0 10px}
.m-grid{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 16px}
.m-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));grid-auto-rows:max-content;gap:8px}
.tile{position:relative;display:block;width:100%;height:auto;padding:0;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--text);text-align:left;overflow:hidden;font-family:inherit}
.tile img{display:block;width:100%;aspect-ratio:1;max-width:100%;object-fit:cover;object-position:50% 8%;background:var(--line)}
.tile .tn{display:block;font-size:12px;padding:4px 5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:2px solid var(--rc)}
.tile .ts{display:block;font-size:9px;color:var(--rc);padding:0 5px 4px;letter-spacing:-1px}
.tile:hover{border-color:var(--dim)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tile .badge{position:absolute;top:4px;right:4px;font-size:11px;padding:1px 5px;color:#fff;display:none}
.tile.is-must{outline:2px solid var(--must);outline-offset:-2px}
.tile.is-must .badge{display:block;background:var(--must-bg)}
.tile.is-ban{outline:2px solid var(--ban);outline-offset:-2px}
.tile.is-ban img{filter:grayscale(1) brightness(.5)}
.tile.is-ban .badge{display:block;background:var(--ban-bg)}
.m-empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--dim)}
.m-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line)}
.m-foot #mInfo{flex:1;min-width:0;font-size:12px;color:var(--dim)}
.btn.sm{height:36px;padding:0 24px;font-size:14px}
@media (max-width:640px){.modal{padding:0}.sheet{height:100%;border:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}.m-head h2{display:none}.m-list{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}}
.card.locked:hover{transform:none}
.hintrow{display:flex;gap:12px;align-items:center;min-height:20px}
.mini{height:24px;padding:0 10px;border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer;font-size:12px}
.mini:hover{color:var(--text);border-color:var(--dim)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--accent),0 0 24px var(--accent)}100%{box-shadow:none}}
.empty{border:1px dashed var(--line);padding:60px 20px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
footer{margin-top:40px;font-size:12px;color:var(--dim)}
footer a{color:var(--dim)}
@media (prefers-reduced-motion:reduce){.card,.card.flash{animation:none}}
@media (max-width:640px){.go{margin-left:0;width:100%}.go .btn{flex:1}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>ARKNIGHTS · RANDOM OPERATOR</small>干员抽选</h1>
    <div class="pool">当前卡池<br><b id="poolN">0</b> / <span id="allN">0</span></div>
  </header>

  <div class="controls">
    <div>
      <span class="lbl">数量</span>
      <span class="stepper">
        <button id="dec" aria-label="减少">−</button>
        <input id="cnt" type="number" min="1" value="10">
        <button id="inc" aria-label="增加">+</button>
      </span>
      <span class="quick"><button data-q="1">1</button><button data-q="4">4</button><button data-q="6">6</button><button data-q="10">10</button><button data-q="12">12</button></span>
    </div>
    <label class="chk"><input type="checkbox" id="dup"> 允许重复</label>
    <div class="go">
      <button class="btn primary" id="draw">抽 取</button>
    </div>
  </div>

  <div class="filters" id="rfilters"><span class="lbl">星级</span></div>
  <div class="filters" id="filters"><span class="lbl">职业</span></div>
  <div class="pick" id="pick">
    <div class="pick-head">
      <span class="lbl">指定</span>
      <div class="search">
        <input id="q" type="search" placeholder="搜索干员（中文名或英文名），设为必出或排除" autocomplete="off" aria-label="搜索干员">
        <div class="results" id="results" hidden></div>
      </div>
      <button class="mini must" data-open="must">＋ 选择必出</button>
      <button class="mini ban" data-open="ban">＋ 选择排除</button>
      <button class="mini" id="clearSel" hidden>清空指定</button>
    </div>
    <div class="sel-row" id="mustRow" hidden><button class="sel-lbl must" data-open="must" title="打开选择面板">必出</button><span class="sel-list" id="mustList"></span></div>
    <div class="sel-row" id="banRow" hidden><button class="sel-lbl ban" data-open="ban" title="打开选择面板">排除</button><span class="sel-list" id="banList"></span></div>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="选择干员">
      <div class="m-head">
        <h2>选择干员</h2>
        <div class="m-tabs">
          <button class="m-tab must" data-mode="must">必出<span id="mMustN"></span></button>
          <button class="m-tab ban" data-mode="ban">排除<span id="mBanN"></span></button>
        </div>
        <button class="m-close" id="mClose" aria-label="关闭">×</button>
      </div>
      <div class="m-filters">
        <input id="mq" type="search" placeholder="按名字筛选" autocomplete="off" aria-label="按名字筛选">
        <div class="m-chips" id="mRar"></div>
        <div class="m-chips" id="mProf"></div>
      </div>
      <div class="m-grid" id="mGrid"></div>
      <div class="m-foot">
        <span id="mInfo"></span>
        <button class="mini" id="mClearK">清空当前分类</button>
        <button class="btn primary sm" id="mDone">完 成</button>
      </div>
    </div>
  </div>
  <div class="hint hintrow"><span id="hint"></span><button class="mini" id="unlockAll" hidden>全部解锁</button></div>
  <div class="grid" id="grid"></div>

  <footer>
    数据：游戏解包数据（ArknightsGameData，2026-10-16 更新，共 432 名干员）· 立绘来自 ArknightsGameResource（本地 img 文件夹）· 详情链接至 <a href="https://prts.wiki" target="_blank" rel="noopener">PRTS</a> · 快捷键：空格 / 回车 抽取；必出/排除设置会保存在本浏览器；Ctrl/Shift+点击筛选项可只选该项
  </footer>
</div>

s":"领主","r":3},{"id":"char_137_brownb","n":"猎蜂","e":"Beehunter","p":"近卫","s":"斗士","r":4},{"id":"char_347_jaksel","n":"杰克","e":"Jackie","p":"近卫","s":"斗士","r":4},{"id":"char_164_nightm","n":"夜魔","e":"Nightmare","p":"术师","s":"中坚术师","r":5},{"id":"char_220_grani","n":"格拉尼","e":"Grani","p":"先锋","s":"冲锋手","r":5},{"id":"char_263_skadi","n":"斯卡蒂","e":"Skadi","p":"近卫","s":"无畏者","r":6}];
const PROFS = ["先锋","近卫","重装","狙击","术师","医疗","辅助","特种"];
const $ = s => document.querySelector(s);
const grid = $("#grid"), cnt = $("#cnt"), dup = $("#dup");
const on = new Set(PROFS);
let current = [];
let locks = [];
const ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="11" width="16" height="10" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const ICON_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="11" width="16" height="10" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>';
const HINT = "点击卡片重抽这一位 · 点左上角锁可锁定，重抽时保留";

const IMG = id => "img/" + id + ".webp";
const wiki = n => "https://prts.wiki/w/" + encodeURIComponent(n);
const RARS = [6,5,4,3,2,1];
const ron = new Set([6]);
const OPMAP = new Map(OPS.map(o => [o.id, o]));
const must = new Set(), ban = new Set();
try {
  const s = JSON.parse(localStorage.getItem("ak-picker-sel") || "{}");
  (s.must || []).forEach(id => OPMAP.has(id) && must.add(id));
  (s.ban || []).forEach(id => OPMAP.has(id) && !must.has(id) && ban.add(id));
} catch (e) {}
function saveSel(){ try { localStorage.setItem("ak-picker-sel", JSON.stringify({ must: [...must], ban: [...ban] })); } catch (e) {} }
const pool = () => OPS.filter(o => on.has(o.p) && ron.has(o.r) && !ban.has(o.id));
const cardClass = (o, i) => "card r" + o.r + (must.has(o.id) ? " mustc" : "") + (locks[i] ? " locked" : "");
const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };

function sample(src, k, exclude){
  if (dup.checked) return Array.from({length:k}, () => src[rnd(src.length)]);
  const a = src.filter(o => !exclude || !exclude.has(o.id));
  for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, k);
}

function cardHTML(o, i){
  return `<button class="lock" title="${locks[i] ? "解锁" : "锁定（重抽时保留）"}" onclick="event.stopPropagation();toggleLock(${i})">${locks[i] ? ICON_LOCK : ICON_OPEN}</button><div class="ph"><img loading="lazy" alt="${o.n}" src="${IMG(o.id)}"
      onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fb',textContent:'${o.n[0]}'}))">
      <span class="stars">${"★".repeat(o.r)}</span></div>
    <div class="info"><div class="nm">${o.n}${must.has(o.id) ? '<span class="mtag">必出</span>' : ""}</div><div class="en">${o.e || "&nbsp;"}</div>
      <div class="cls"><b>${o.p}</b>${o.s}</div>
      <a class="wiki" href="${wiki(o.n)}" target="_blank" rel="noopener" title="在 PRTS 查看" onclick="event.stopPropagation()">PRTS ↗</a></div>`;
}

function render(){
  grid.innerHTML = "";
  if (!current.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><b>还没有抽取</b>设置数量后点击「抽取」</div>`;
    $("#hint").textContent = ""; return;
  }
  current.forEach((o, i) => {
    const d = document.createElement("div");
    d.className = cardClass(o, i); d.style.animationDelay = (locks[i] ? 0 : i * 40) + "ms";
    if (locks[i]) d.style.animation = "none";
    d.innerHTML = cardHTML(o, i);
    d.onclick = () => rerollOne(i, d);
    grid.appendChild(d);
  });
  $("#hint").textContent = HINT; updateLockUI();
}

function cardEl(i){ return grid.children[i]; }
function toggleLock(i){
  locks[i] = !locks[i];
  const el = cardEl(i);
  el.classList.toggle("locked", locks[i]);
  el.innerHTML = cardHTML(current[i], i);
  updateLockUI();
}
function updateLockUI(){
  const n = locks.filter(Boolean).length;
  $("#unlockAll").hidden = !n;
  $("#unlockAll").textContent = `全部解锁（${n}）`;
  clampCount();
}
$("#unlockAll").onclick = () => { locks = locks.map(() => false); render(); };

function rerollOne(i, el){
  if (locks[i]) { flashHint("这位已锁定，先点左上角解锁才能重抽"); return; }
  if (must.has(current[i].id)) { flashHint("这位是必出干员，先在上方取消必出才能重抽"); return; }
  const src = pool();
  const taken = new Set(current.map(o => o.id));
  let pick;
  if (dup.checked) { pick = src[rnd(src.length)]; }
  else {
    const rest = src.filter(o => !taken.has(o.id));
    if (!rest.length) { flashHint("卡池里没有其他干员可换了"); return; }
    pick = rest[rnd(rest.length)];
  }
  current[i] = pick;
  el.className = cardClass(pick, i); el.style.animation = ""; el.innerHTML = cardHTML(pick, i);
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

function draw(){
  const src = pool();
  const k = clampCount();
  const kept = current.map((o, i) => locks[i] ? o : null);
  const keptOps = kept.filter(Boolean);
  const keptIds = new Set(keptOps.map(o => o.id));
  const mustOps = [...must].map(id => OPMAP.get(id)).filter(o => !keptIds.has(o.id));
  const taken = new Set([...keptIds, ...mustOps.map(o => o.id)]);
  const need = k - keptOps.length - mustOps.length;
  if (need > 0 && !src.length) { flashHint("当前卡池为空，请调整筛选"); return; }
  const fresh = sample(src.filter(o => !must.has(o.id)), Math.max(0, need), taken);
  const picks = [...mustOps, ...fresh];
  for (let i = picks.length - 1; i > 0; i--){ const j = rnd(i + 1); [picks[i], picks[j]] = [picks[j], picks[i]]; }
  // 锁定的干员尽量留在原位置
  const next = new Array(k).fill(null), nextLocks = new Array(k).fill(false);
  const overflow = [];
  kept.forEach((o, i) => { if (!o) return; if (i < k) { next[i] = o; nextLocks[i] = true; } else overflow.push(o); });
  for (let i = 0; i < k; i++) if (!next[i]) { if (overflow.length) { next[i] = overflow.shift(); nextLocks[i] = true; } else next[i] = picks.shift(); }
  current = next.filter(Boolean); locks = nextLocks.slice(0, current.length);
  render();
  $("#draw").textContent = "重 抽";
}

function clampCount(){
  const lockedOps = current.filter((o, i) => locks[i]);
  const ids = new Set(pool().map(o => o.id)); lockedOps.forEach(o => ids.add(o.id)); must.forEach(id => ids.add(id));
  const lockedIds = new Set(lockedOps.map(o => o.id));
  const min = Math.max(1, lockedOps.length + [...must].filter(id => !lockedIds.has(id)).length);
  const max = Math.max(min, dup.checked ? 99 : ids.size);
  let v = parseInt(cnt.value, 10); if (isNaN(v)) v = 1;
  v = Math.min(max, Math.max(min, v)); cnt.value = v; cnt.max = max; return v;
}
let hintT;
function flashHint(t){ const h = $("#hint"); h.textContent = t; clearTimeout(hintT); hintT = setTimeout(() => current.length && (h.textContent = HINT), 1800); }

function updatePool(){
  const n = pool().length;
  $("#poolN").textContent = n; $("#draw").disabled = !n && !locks.some(Boolean) && !must.size; clampCount();
  refreshChips();
}

function refreshChips(){
  document.querySelectorAll("#filters .chip").forEach(c => {
    if (!c.dataset.p){ c.classList.toggle("on", on.size === PROFS.length); return; }
    c.classList.toggle("on", on.has(c.dataset.p));
    c.querySelector(".n").textContent = OPS.filter(o => o.p === c.dataset.p && ron.has(o.r)).length;
  });
  document.querySelectorAll("#rfilters .chip").forEach(c => {
    if (!c.dataset.r){ c.classList.toggle("on", ron.size === RARS.length); return; }
    c.classList.toggle("on", ron.has(+c.dataset.r));
    c.querySelector(".n").textContent = OPS.filter(o => o.r === +c.dataset.r && on.has(o.p)).length;
  });
}
const rf = $("#rfilters");
const rall = document.createElement("button");
rall.className = "chip"; rall.textContent = "全部";
rall.onclick = () => { if (ron.size === RARS.length) ron.clear(); else RARS.forEach(r => ron.add(r)); updatePool(); };
rf.appendChild(rall);
RARS.forEach(r => {
  const b = document.createElement("button");
  b.className = "chip rar r" + r; b.dataset.r = r;
  b.innerHTML = `<span class="s">${"★".repeat(r)}</span><span class="n"></span>`;
  b.onclick = e => { if (e.shiftKey || e.ctrlKey){ ron.clear(); ron.add(r); } else ron.has(r) ? ron.delete(r) : ron.add(r); updatePool(); };
  b.title = "点击切换；Ctrl/Shift+点击 只选这一档";
  rf.appendChild(b);
});
// filters
const f = $("#filters");
const all = document.createElement("button");
all.className = "chip"; all.textContent = "全部"; all.onclick = () => { if (on.size === PROFS.length) on.clear(); else PROFS.forEach(p => on.add(p)); updatePool(); };
f.appendChild(all);
PROFS.forEach(p => {
  const b = document.createElement("button");
  b.className = "chip"; b.dataset.p = p;
  b.innerHTML = `${p}<span class="n">${OPS.filter(o => o.p === p).length}</span>`;
  b.onclick = e => { if (e.shiftKey || e.ctrlKey){ on.clear(); on.add(p); } else on.has(p) ? on.delete(p) : on.add(p); updatePool(); };
  b.title = "点击切换；Ctrl/Shift+点击 只选这一个";
  f.appendChild(b);
});

$("#dec").onclick = () => { cnt.value = (+cnt.value || 1) - 1; clampCount(); };
$("#inc").onclick = () => { cnt.value = (+cnt.value || 0) + 1; clampCount(); };
cnt.onchange = clampCount; dup.onchange = clampCount;
document.querySelectorAll(".quick button").forEach(b => b.onclick = () => { cnt.value = b.dataset.q; clampCount(); });
$("#draw").onclick = draw;
document.addEventListener("keydown", e => {
  if (!$("#modal").hidden) { if (e.key === "Escape") closePanel(); return; }
  if ((e.key === " " || e.key === "Enter") && e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON"){ e.preventDefault(); draw(); }
});

// ---- 指定干员：必出 / 排除
const q = $("#q"), results = $("#results");
function setSel(id, kind){
  if (kind === "must") { if (must.has(id)) must.delete(id); else { must.add(id); ban.delete(id); } }
  else { if (ban.has(id)) ban.delete(id); else { ban.add(id); must.delete(id); } }
  saveSel(); refreshSel();
  updateTile(id);
}
function chipHTML(o, kind){
  return `<button class="schip r${o.r}" data-id="${o.id}" data-k="${kind}" title="移除">${o.n}<span>×</span></button>`;
}
function refreshSel(){
  const m = [...must].map(id => OPMAP.get(id)), b = [...ban].map(id => OPMAP.get(id));
  $("#mustList").innerHTML = m.map(o => chipHTML(o, "must")).join("");
  $("#banList").innerHTML = b.map(o => chipHTML(o, "ban")).join("");
  $("#mustRow").hidden = !m.length; $("#banRow").hidden = !b.length;
  $("#clearSel").hidden = !(m.length || b.length);
  if (!results.hidden) showResults();
  current.forEach((o, i) => { const el = cardEl(i); if (el) { el.className = cardClass(o, i); el.style.animation = "none"; el.innerHTML = cardHTML(o, i); } });
  updatePool();
}
function showResults(){
  const s = q.value.trim().toLowerCase();
  if (!s) { results.hidden = true; return; }
  const hits = OPS.filter(o => o.n.toLowerCase().includes(s) || o.e.toLowerCase().includes(s))
    .sort((a, b) => (b.n.toLowerCase().startsWith(s) - a.n.toLowerCase().startsWith(s)) || b.r - a.r).slice(0, 12);
  results.innerHTML = hits.length ? hits.map(o => `<div class="res r${o.r}">
      <img src="${IMG(o.id)}" alt="" loading="lazy">
      <div class="rn">${o.n}<small>${o.p}·${o.s}</small><span class="st">${"★".repeat(o.r)}</span></div>
      <button class="tg must${must.has(o.id) ? " on" : ""}" data-id="${o.id}" data-k="must">必出</button>
      <button class="tg ban${ban.has(o.id) ? " on" : ""}" data-id="${o.id}" data-k="ban">排除</button>
    </div>`).join("") : `<div class="none">没有找到「${q.value.trim().replace(/[<>&]/g, "")}」</div>`;
  results.hidden = false;
}
q.addEventListener("input", showResults);
q.addEventListener("focus", showResults);
q.addEventListener("keydown", e => { if (e.key === "Escape") { q.value = ""; results.hidden = true; q.blur(); } });
results.addEventListener("mousedown", e => e.preventDefault());
results.addEventListener("click", e => { const b = e.target.closest(".tg"); if (b) setSel(b.dataset.id, b.dataset.k); });
document.addEventListener("click", e => { if (!e.target.closest(".search")) results.hidden = true; });
$("#pick").addEventListener("click", e => { const c = e.target.closest(".schip"); if (c) setSel(c.dataset.id, c.dataset.k); });
$("#clearSel").onclick = () => { must.clear(); ban.clear(); saveSel(); refreshSel(); };
refreshSel();

// ---- 选择面板
const modal = $("#modal"), mGrid = $("#mGrid");
let mMode = "must";
const mRon = new Set(), mOn = new Set(PROFS);
function tileHTML(o){
  const st = must.has(o.id) ? "is-must" : ban.has(o.id) ? "is-ban" : "";
  return `<button class="tile r${o.r} ${st}" data-id="${o.id}" title="${o.n} · ${o.p}·${o.s}">
    <img src="${IMG(o.id)}" alt="" loading="lazy"><span class="badge">${must.has(o.id) ? "必出" : ban.has(o.id) ? "排除" : ""}</span>
    <span class="tn">${o.n}</span><span class="ts">${"★".repeat(o.r)}</span></button>`;
}
function updateTile(id){
  if (modal.hidden) return;
  const el = mGrid.querySelector(`.tile[data-id="${id}"]`);
  if (el) el.outerHTML = tileHTML(OPMAP.get(id));
  mHeader();
}
function mHeader(){
  document.querySelectorAll(".m-tab").forEach(b => b.classList.toggle("on", b.dataset.mode === mMode));
  $("#mMustN").textContent = must.size || ""; $("#mBanN").textContent = ban.size || "";
  const shown = mGrid.querySelectorAll(".tile").length;
  $("#mInfo").textContent = `点击头像加入或移出「${mMode === "must" ? "必出" : "排除"}」 · 显示 ${shown} 人`;
  $("#mClearK").textContent = `清空${mMode === "must" ? "必出" : "排除"}`;
  document.querySelectorAll("#mRar .chip").forEach(c => c.classList.toggle("on", c.dataset.r ? mRon.has(+c.dataset.r) : mRon.size === RARS.length));
  document.querySelectorAll("#mProf .chip").forEach(c => c.classList.toggle("on", c.dataset.p ? mOn.has(c.dataset.p) : mOn.size === PROFS.length));
}
function renderGrid(){
  const s = $("#mq").value.trim().toLowerCase();
  const list = OPS.filter(o => mRon.has(o.r) && mOn.has(o.p) && (!s || o.n.toLowerCase().includes(s) || o.e.toLowerCase().includes(s)))
    .sort((a, b) => b.r - a.r);
  mGrid.innerHTML = `<div class="m-list">${list.length ? list.map(tileHTML).join("") : `<div class="m-empty">没有符合条件的干员</div>`}</div>`;
  mHeader();
}
function chipToggle(set, all, v, e){
  if (v === undefined) { if (set.size === all.length) set.clear(); else all.forEach(x => set.add(x)); }
  else if (e.shiftKey || e.ctrlKey) { set.clear(); set.add(v); }
  else set.has(v) ? set.delete(v) : set.add(v);
  renderGrid();
}
(function buildMChips(){
  const mr = $("#mRar"), mp = $("#mProf");
  const a1 = document.createElement("button"); a1.className = "chip"; a1.textContent = "全部星级";
  a1.onclick = e => chipToggle(mRon, RARS, undefined, e); mr.appendChild(a1);
  RARS.forEach(r => { const b = document.createElement("button"); b.className = "chip rar r" + r; b.dataset.r = r;
    b.innerHTML = `<span class="s">${"★".repeat(r)}</span>`; b.onclick = e => chipToggle(mRon, RARS, r, e); mr.appendChild(b); });
  const a2 = document.createElement("button"); a2.className = "chip"; a2.textContent = "全部职业";
  a2.onclick = e => chipToggle(mOn, PROFS, undefined, e); mp.appendChild(a2);
  PROFS.forEach(p => { const b = document.createElement("button"); b.className = "chip"; b.dataset.p = p; b.textContent = p;
    b.onclick = e => chipToggle(mOn, PROFS, p, e); mp.appendChild(b); });
})();
let lastFocus = null;
function openPanel(k){
  mMode = k; lastFocus = document.activeElement;
  mRon.clear(); (ron.size ? ron : new Set(RARS)).forEach(r => mRon.add(r));
  mOn.clear(); PROFS.forEach(p => mOn.add(p));
  $("#mq").value = ""; results.hidden = true;
  modal.hidden = false; document.body.style.overflow = "hidden";
  renderGrid(); mGrid.scrollTop = 0; $("#mq").focus();
}
function closePanel(){
  modal.hidden = true; document.body.style.overflow = "";
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) openPanel(b.dataset.open); });
document.querySelectorAll(".m-tab").forEach(b => b.onclick = () => { mMode = b.dataset.mode; mHeader(); });
mGrid.addEventListener("click", e => { const t = e.target.closest(".tile"); if (t) setSel(t.dataset.id, mMode); });
$("#mq").addEventListener("input", renderGrid);
$("#mClose").onclick = closePanel; $("#mDone").onclick = closePanel;
modal.addEventListener("click", e => { if (e.target === modal) closePanel(); });
$("#mClearK").onclick = () => {
  const set = mMode === "must" ? must : ban; const ids = [...set];
  set.clear(); saveSel(); refreshSel(); ids.forEach(updateTile); mHeader();
};

$("#allN").textContent = OPS.length;
updatePool(); render();
</script>
</body>
</html>
